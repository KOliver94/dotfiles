name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Run tests
        run: node --test "test/*.test.mjs"

      - name: Test bootstrap helpers
        run: powershell -NoProfile -ExecutionPolicy Bypass -File test/windows.test.ps1
